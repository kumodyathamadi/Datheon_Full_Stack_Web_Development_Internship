<!doctype html>
<html lang="en" data-theme="dark" data-condition="clear-night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <script type="module" src="/src/main.js"></script>
